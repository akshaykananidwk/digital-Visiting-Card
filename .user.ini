; PHP settings for FPM, CGI and LiteSpeed, where .htaccess php_value is not
; available. mod_php reads the equivalents from .htaccess instead.
;
; PHP caches this file for user_ini.cache_ttl seconds (300 by default), so a
; change here can take a few minutes to take effect.
display_errors = Off
log_errors = On
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 120
memory_limit = 256M
